[project]
name = "pasqal-learned-selection"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "networkx>=3.3",
    "numpy",
    "matplotlib",
    "ortools",
    "pulser",
    "pasqal-cloud",
    "lightgbm>=4.7.0",
    "cma>=4.5.0",
    "torch>=2.15.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["learned_selection"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
